services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campovivo
      POSTGRES_USER: campovivo
      POSTGRES_PASSWORD: campo_vivo_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campovivo -d campovivo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
