@media(max-width:600px){.pane{padding:18px}}</style></head><body><header><h1>&#x1F40E; Especificacao &mdash; Gestao Fabrica de Selas</h1><nav><button data-pane="req" class="active">Requisitos</button><button data-pane="design">Design Tecnico</button><button data-pane="tasks">Plano de Revisao</button></nav></header><main><div id="pane-req" class="pane active"></div><div id="pane-design" class="pane"></div><div id="pane-tasks" class="pane"></div></main><footer>Especificacao gerada automaticamente &mdash; somente leitura, sem codigo de implementacao</footer><script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script><script>var docs={req:"# Requirements Document\n\n## Introduction\n\nEste documento define os requisitos para o sistema web responsivo de gestão e controle de fábrica de selas para equinos e muares. O sistema abrange os módulos de Cadastros Base, Produção, Estoque, Vendas e Financeiro, com foco em usabilidade prática e navegação simples para uso interno. O modelo de produção é misto: ordens por encomenda (cliente específico) e produção para estoque (pronta-entrega). O controle de custos de produção (mão de obra e materiais por peça), comissões de representantes/vendedores e fretes/transportes são contemplados.\n\n---\n\n## Glossary\n\n- **Sistema**: Aplicação web responsiva de gestão da fábrica de selas.\n- **Usuário**: Pessoa autenticada que opera o Sistema (perfis: Administrador, Operacional).\n- **Administrador**: Usuário com acesso irrestrito a todos os módulos e configurações.\n- **Operacional**: Usuário com acesso às funcionalidades do dia a dia, sem acesso a configurações de sistema e relatórios financeiros consolidados.\n- **Cliente**: Pessoa física ou jurídica que realiza pedidos de selas.\n- **Fornecedor**: Pessoa física ou jurídica que fornece matérias-primas ou serviços.\n- **Funcionário**: Colaborador da fábrica registrado no sistema, podendo ser artesão, costureiro, vendedor ou representante.\n- **Modelo de Sela**: Especificação técnica de um tipo de sela, contendo nome, descrição, lista de materiais padrão e custo estimado.\n- **Matéria-Prima**: Insumo utilizado na fabricação de selas (couro, espuma, ferragem, linha, etc.).\n- **Ordem de Produção**: Documento que registra a fabricação de uma ou mais selas, podendo ser por encomenda (vinculada a um Cliente) ou para estoque.\n- **Etapa de Produção**: Fase específica do processo de fabricação (ex.: corte, costura, montagem, acabamento).\n- **Apontamento de Produção**: Registro de execução de uma Etapa de Produção, contendo o Funcionário responsável, tempo e custo de mão de obra.\n- **Requisição de Material**: Registro de consumo de Matéria-Prima vinculado a uma Ordem de Produção.\n- **Sela Acabada**: Unidade de sela concluída pela produção e disponível no estoque de produtos acabados.\n- **Pedido de Venda**: Documento comercial que registra a venda de uma ou mais Selas Acabadas a um Cliente.\n- **Fatura**: Documento financeiro gerado a partir de um Pedido de Venda, representando o valor a receber.\n- **Comissão**: Percentual ou valor fixo devido a um Funcionário (representante/vendedor) pela realização de uma venda.\n- **Frete**: Custo de transporte associado a um Pedido de Venda.\n- **Conta a Receber**: Registro de valor a ser recebido de um Cliente, originado de uma Fatura.\n- **Conta a Pagar**: Registro de valor a ser pago a um Fornecedor ou Funcionário.\n- **Fluxo de Caixa**: Visão consolidada de entradas e saídas financeiras em um período.\n- **Estoque de MP**: Quantidade disponível de cada Matéria-Prima no almoxarifado.\n- **Estoque de PA**: Quantidade disponível de cada Sela Acabada no depósito de produtos acabados.\n\n---\n\n## Requirements\n\n### Requisito 1 — Autenticação e Controle de Acesso\n\n**User Story:** Como Usuário, quero autenticar-me com e-mail e senha para acessar o Sistema com segurança.\n\n#### Critérios de Aceite\n\n1. WHEN um Usuário submete e-mail e senha válidos no formulário de login, THE Sistema SHALL autenticar o Usuário e redirecionar para o dashboard principal.\n2. IF um Usuário submete credenciais inválidas, THEN THE Sistema SHALL exibir a mensagem \"E-mail ou senha inválidos\" e manter o Usuário na tela de login.\n3. WHEN um Usuário autenticado solicita logout, THE Sistema SHALL encerrar a sessão e redirecionar para a tela de login.\n4. WHILE um Usuário não está autenticado, THE Sistema SHALL redirecionar qualquer acesso a rotas protegidas para a tela de login.\n5. THE Sistema SHALL suportar dois perfis de acesso: Administrador e Operacional.\n6. WHILE o Usuário autenticado possui perfil Operacional, THE Sistema SHALL ocultar as funcionalidades restritas ao Administrador, incluindo configurações de sistema, exclusão de registros e relatórios financeiros consolidados.\n\n---\n\n### Requisito 2 — Cadastro de Clientes\n\n**User Story:** Como Usuário, quero cadastrar e gerenciar clientes para vincular encomendas e pedidos de venda.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o cadastro de Clientes com os campos: nome/razão social, CPF/CNPJ, telefone, e-mail e endereço completo.\n2. WHEN um Usuário submete o formulário de cadastro de Cliente com CPF/CNPJ já existente no Sistema, THE Sistema SHALL exibir a mensagem \"CPF/CNPJ já cadastrado\" e impedir a duplicação.\n3. THE Sistema SHALL exibir a lista de Clientes cadastrados com busca por nome e CPF/CNPJ.\n4. WHEN um Usuário edita os dados de um Cliente e confirma, THE Sistema SHALL salvar as alterações e exibir mensagem de confirmação.\n5. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir a inativação de um Cliente, impedindo que o Cliente seja vinculado a novas Ordens de Produção ou Pedidos de Venda.\n\n---\n\n### Requisito 3 — Cadastro de Fornecedores\n\n**User Story:** Como Usuário, quero cadastrar e gerenciar fornecedores para registrar as compras de matérias-primas.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o cadastro de Fornecedores com os campos: nome/razão social, CPF/CNPJ, telefone, e-mail, endereço completo e categoria (matéria-prima, serviço ou ambos).\n2. WHEN um Usuário submete o formulário de cadastro de Fornecedor com CPF/CNPJ já existente no Sistema, THE Sistema SHALL exibir a mensagem \"CPF/CNPJ já cadastrado\" e impedir a duplicação.\n3. THE Sistema SHALL exibir a lista de Fornecedores com busca por nome e CPF/CNPJ.\n4. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir a inativação de um Fornecedor.\n\n---\n\n### Requisito 4 — Cadastro de Funcionários\n\n**User Story:** Como Usuário, quero cadastrar funcionários para registrar mão de obra na produção e comissões nas vendas.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o cadastro de Funcionários com os campos: nome completo, CPF, telefone, função (artesão, costureiro, vendedor, representante ou múltiplas funções), salário/hora e percentual de comissão.\n2. WHEN um Usuário submete o formulário de cadastro de Funcionário com CPF já existente, THE Sistema SHALL exibir a mensagem \"CPF já cadastrado\" e impedir a duplicação.\n3. THE Sistema SHALL exibir a lista de Funcionários com busca por nome e função.\n4. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir a inativação de um Funcionário.\n\n---\n\n### Requisito 5 — Cadastro de Matérias-Primas\n\n**User Story:** Como Usuário, quero cadastrar matérias-primas para controlar o estoque e os custos de produção.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o cadastro de Matérias-Primas com os campos: nome, unidade de medida (metro, quilograma, unidade, par), custo unitário de referência e estoque mínimo.\n2. THE Sistema SHALL exibir a lista de Matérias-Primas com busca por nome e unidade de medida.\n3. WHEN o Estoque de MP de uma Matéria-Prima atingir ou ficar abaixo do estoque mínimo, THE Sistema SHALL exibir um alerta visual na listagem de Matérias-Primas e no dashboard.\n4. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir a inativação de uma Matéria-Prima.\n\n---\n\n### Requisito 6 — Cadastro de Modelos de Sela\n\n**User Story:** Como Usuário, quero cadastrar modelos de sela com suas composições padrão para agilizar a criação de ordens de produção.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o cadastro de Modelos de Sela com os campos: nome, descrição, categoria (sela de vaqueiro, sela inglesa, cangalha, etc.) e lista de Matérias-Primas padrão com quantidade por peça.\n2. THE Sistema SHALL calcular e exibir o custo estimado de materiais do Modelo de Sela com base nas quantidades padrão e nos custos unitários de referência das Matérias-Primas vinculadas.\n3. THE Sistema SHALL exibir a lista de Modelos de Sela com busca por nome e categoria.\n4. WHEN um Usuário edita a lista de materiais de um Modelo de Sela, THE Sistema SHALL recalcular e atualizar o custo estimado de materiais automaticamente.\n\n---\n\n### Requisito 7 — Gestão de Estoque de Matérias-Primas\n\n**User Story:** Como Usuário, quero registrar entradas e saídas de matérias-primas para manter o controle de estoque atualizado.\n\n#### Critérios de Aceite\n\n1. WHEN um Usuário registra uma entrada de Matéria-Prima informando o Fornecedor, quantidade, custo unitário e data, THE Sistema SHALL incrementar o Estoque de MP da Matéria-Prima pelo valor informado.\n2. WHEN uma Requisição de Material é confirmada em uma Ordem de Produção, THE Sistema SHALL decrementar automaticamente o Estoque de MP das Matérias-Primas requisitadas pelas quantidades informadas.\n3. IF uma Requisição de Material solicitar quantidade superior ao Estoque de MP disponível, THEN THE Sistema SHALL exibir alerta indicando \"Estoque insuficiente para [nome da matéria-prima]\" e impedir a confirmação da requisição.\n4. THE Sistema SHALL exibir o saldo atual do Estoque de MP de cada Matéria-Prima.\n5. THE Sistema SHALL registrar um histórico de movimentações (entradas e saídas) por Matéria-Prima, contendo data, tipo de movimentação, quantidade, custo unitário e documento de origem.\n6. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir o registro de ajustes de inventário com justificativa obrigatória.\n\n---\n\n### Requisito 8 — Gestão de Ordens de Produção\n\n**User Story:** Como Usuário, quero criar e acompanhar ordens de produção para controlar a fabricação de selas, seja por encomenda ou para estoque.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir a criação de Ordens de Produção com os campos: tipo (encomenda ou estoque), Modelo de Sela, quantidade, data de abertura, data prevista de conclusão e, quando do tipo encomenda, o Cliente vinculado.\n2. WHEN uma Ordem de Produção é criada a partir de um Modelo de Sela, THE Sistema SHALL pré-preencher a lista de Matérias-Primas necessárias com base na composição padrão do Modelo, permitindo ajustes antes da confirmação.\n3. THE Sistema SHALL registrar as Etapas de Produção associadas à Ordem de Produção, contendo: nome da etapa, Funcionário responsável, data de execução, horas trabalhadas e custo de mão de obra calculado (horas × salário/hora do Funcionário).\n4. THE Sistema SHALL calcular e exibir o custo total de cada Ordem de Produção como a soma dos custos de materiais (Matérias-Primas consumidas × custo unitário) e dos custos de mão de obra (soma dos Apontamentos de Produção).\n5. THE Sistema SHALL suportar os seguintes status para Ordens de Produção: Aberta, Em Produção, Concluída e Cancelada.\n6. WHEN uma Ordem de Produção é marcada como Concluída, THE Sistema SHALL incrementar o Estoque de PA com a quantidade de Selas Acabadas produzidas, vinculando o custo unitário de produção ao lote.\n7. IF uma Ordem de Produção do tipo encomenda for cancelada, THEN THE Sistema SHALL notificar o Usuário para verificar o impacto no Pedido de Venda vinculado, caso exista.\n8. THE Sistema SHALL exibir a lista de Ordens de Produção com filtros por status, tipo, período e Modelo de Sela.\n9. WHILE uma Ordem de Produção possui status Concluída ou Cancelada, THE Sistema SHALL impedir a edição dos Apontamentos de Produção e Requisições de Material vinculados.\n\n---\n\n### Requisito 9 — Gestão de Estoque de Produtos Acabados\n\n**User Story:** Como Usuário, quero visualizar e controlar o estoque de selas acabadas para gerenciar a disponibilidade para venda.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL exibir o saldo atual do Estoque de PA por Modelo de Sela, incluindo quantidade disponível e custo médio unitário.\n2. WHEN uma Sela Acabada é vinculada a um Pedido de Venda confirmado, THE Sistema SHALL decrementar o Estoque de PA pela quantidade vendida.\n3. IF um Pedido de Venda solicitar quantidade superior ao Estoque de PA disponível de um Modelo de Sela, THEN THE Sistema SHALL exibir alerta indicando \"Estoque insuficiente para [nome do modelo]\" antes da confirmação do pedido.\n4. THE Sistema SHALL registrar um histórico de movimentações do Estoque de PA por Modelo de Sela, contendo data, tipo (entrada por produção ou saída por venda), quantidade e documento de origem.\n5. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir o registro de ajustes de inventário no Estoque de PA com justificativa obrigatória.\n\n---\n\n### Requisito 10 — Gestão de Pedidos de Venda\n\n**User Story:** Como Usuário, quero registrar pedidos de venda para controlar as negociações e faturamento.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir a criação de Pedidos de Venda com os campos: Cliente, data do pedido, Funcionário responsável pela venda (vendedor ou representante), lista de Selas Acabadas (Modelo, quantidade e preço unitário), valor do Frete e observações.\n2. THE Sistema SHALL calcular e exibir o valor total do Pedido de Venda como a soma dos valores dos itens mais o Frete.\n3. WHEN um Pedido de Venda é confirmado, THE Sistema SHALL calcular a Comissão devida ao Funcionário responsável com base no percentual de comissão cadastrado aplicado sobre o valor total dos itens (excluindo o Frete).\n4. WHEN um Pedido de Venda é confirmado, THE Sistema SHALL gerar uma Fatura com o valor total do pedido e as parcelas de pagamento definidas pelo Usuário.\n5. WHEN um Pedido de Venda é confirmado e os itens são do tipo estoque, THE Sistema SHALL decrementar o Estoque de PA pelas quantidades vendidas.\n6. THE Sistema SHALL suportar os seguintes status para Pedidos de Venda: Rascunho, Confirmado, Faturado, Entregue e Cancelado.\n7. IF um Pedido de Venda for cancelado após confirmação, THEN THE Sistema SHALL reverter o decremento do Estoque de PA e marcar a Fatura vinculada como Cancelada.\n8. THE Sistema SHALL exibir a lista de Pedidos de Venda com filtros por status, Cliente, Funcionário responsável e período.\n\n---\n\n### Requisito 11 — Gestão de Comissões\n\n**User Story:** Como Usuário, quero visualizar e controlar as comissões devidas aos vendedores e representantes para garantir o pagamento correto.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL exibir a lista de Comissões calculadas por Pedido de Venda confirmado, contendo: Funcionário, Pedido de Venda de origem, valor da venda base (sem Frete), percentual aplicado e valor da Comissão.\n2. THE Sistema SHALL suportar os seguintes status de Comissão: Pendente, Paga e Cancelada.\n3. WHEN um Usuário registra o pagamento de uma Comissão, THE Sistema SHALL atualizar o status da Comissão para Paga e gerar um lançamento na Conta a Pagar correspondente.\n4. THE Sistema SHALL exibir o total de Comissões pendentes por Funcionário.\n\n---\n\n### Requisito 12 — Contas a Receber\n\n**User Story:** Como Usuário, quero gerenciar as contas a receber para acompanhar os pagamentos dos clientes.\n\n#### Critérios de Aceite\n\n1. WHEN uma Fatura é gerada a partir de um Pedido de Venda, THE Sistema SHALL criar automaticamente os registros de Contas a Receber com as parcelas, datas de vencimento e valores definidos.\n2. THE Sistema SHALL exibir a lista de Contas a Receber com filtros por Cliente, status (Em Aberto, Recebida, Vencida, Cancelada) e período de vencimento.\n3. WHEN um Usuário registra o recebimento de uma parcela informando a data e o valor recebido, THE Sistema SHALL atualizar o status da parcela para Recebida e registrar o valor no Fluxo de Caixa como entrada.\n4. WHEN a data atual superar a data de vencimento de uma Conta a Receber com status Em Aberto, THE Sistema SHALL atualizar o status da parcela para Vencida.\n5. THE Sistema SHALL exibir o total de Contas a Receber em aberto e o total vencido, agrupados por Cliente.\n\n---\n\n### Requisito 13 — Contas a Pagar\n\n**User Story:** Como Usuário, quero gerenciar as contas a pagar para controlar os compromissos financeiros da fábrica.\n\n#### Critérios de Aceite\n\n1. THE Sistema SHALL permitir o registro manual de Contas a Pagar com os campos: Fornecedor ou Funcionário beneficiário, descrição, valor, data de vencimento e categoria (matéria-prima, serviço, comissão, frete, outros).\n2. WHEN um Usuário registra uma entrada de Matéria-Prima vinculada a um Fornecedor, THE Sistema SHALL criar automaticamente uma Conta a Pagar para o Fornecedor com o valor total da nota de entrada e a data de vencimento informada.\n3. THE Sistema SHALL exibir a lista de Contas a Pagar com filtros por beneficiário, status (Em Aberto, Paga, Vencida, Cancelada) e período de vencimento.\n4. WHEN um Usuário registra o pagamento de uma Conta a Pagar informando a data e o valor pago, THE Sistema SHALL atualizar o status para Paga e registrar o valor no Fluxo de Caixa como saída.\n5. WHEN a data atual superar a data de vencimento de uma Conta a Pagar com status Em Aberto, THE Sistema SHALL atualizar o status para Vencida.\n6. THE Sistema SHALL exibir o total de Contas a Pagar em aberto e o total vencido.\n\n---\n\n### Requisito 14 — Fluxo de Caixa\n\n**User Story:** Como Usuário Administrador, quero visualizar o fluxo de caixa para acompanhar a saúde financeira da fábrica.\n\n#### Critérios de Aceite\n\n1. WHILE o Usuário autenticado possui perfil Administrador, THE Sistema SHALL exibir o módulo de Fluxo de Caixa.\n2. THE Sistema SHALL consolidar no Fluxo de Caixa todas as entradas (recebimentos de Contas a Receber) e saídas (pagamentos de Contas a Pagar) registradas no Sistema.\n3. THE Sistema SHALL exibir o saldo atual do caixa como a diferença entre o total de entradas e o total de saídas registradas.\n4. WHEN um Usuário Administrador seleciona um período, THE Sistema SHALL exibir o extrato de movimentações de caixa do período selecionado com data, descrição, tipo (entrada ou saída), valor e saldo acumulado.\n5. THE Sistema SHALL exibir o total de entradas, o total de saídas e o saldo líquido do período selecionado.\n6. WHERE o perfil do Usuário é Administrador, THE Sistema SHALL permitir o registro de lançamentos avulsos no Fluxo de Caixa com descrição, tipo (entrada ou saída), valor e data obrigatórios.\n\n---\n\n### Requisito 15 — Dashboard e Navegação\n\n**User Story:** Como Usuário, quero uma tela inicial com indicadores resumidos e navegação simples para acessar rapidamente os módulos do sistema.\n\n#### Critérios de Aceite\n\n1. WHEN um Usuário autenticado acessa o dashboard, THE Sistema SHALL exibir os seguintes indicadores: ordens de produção em andamento, pedidos de venda confirmados no mês, total de Contas a Receber em aberto, alertas de Matérias-Primas abaixo do estoque mínimo e (exclusivo para Administrador) saldo atual do Fluxo de Caixa.\n2. THE Sistema SHALL apresentar navegação por menu lateral ou superior com acesso direto aos módulos: Clientes, Fornecedores, Funcionários, Matérias-Primas, Modelos de Sela, Produção, Estoque, Vendas e Financeiro.\n3. WHILE o Usuário acessa o Sistema em dispositivo com largura de tela inferior a 768 pixels, THE Sistema SHALL apresentar o menu de navegação em formato colapsável (hamburguer) e os formulários e tabelas em layout adaptado para tela pequena.\n4. THE Sistema SHALL garantir que todos os formulários, tabelas e botões sejam operáveis por toque em dispositivos móveis, com área mínima de toque de 44×44 pixels para elementos interativos.\n5. THE Sistema SHALL exibir mensagens de confirmação de sucesso e de erro em operações de criação, edição e exclusão de registros.\n",design:"# Design Document — Gestão Fábrica de Selas\n\n## Overview\n\nO sistema é uma aplicação web responsiva construída com **Next.js 16 (App Router)**, **React 19**, **TypeScript**, **Tailwind CSS 4** e **PostgreSQL** via driver `pg`, seguindo os padrões já estabelecidos no projeto `gestaoequestre`. A autenticação é gerenciada por **NextAuth v4**. O modelo de acesso é multi-perfil (Administrador / Operacional) dentro de um único tenant.\n\nA arquitetura segue o padrão já adotado no projeto:\n\n- **Páginas / Componentes** — React Server Components e Client Components na pasta `src/app/`\n- **API Routes** — Next.js Route Handlers em `src/app/api/`\n- **Acesso a dados** — funções utilitárias em `src/lib/db.ts` usando `pg`\n- **Autenticação** — NextAuth em `src/app/api/auth/[...nextauth]/`\n- **Utilitários** — `src/lib/`\n\n---\n\n## Architecture\n\n```\n┌──────────────────────────────────────────────────────────────┐\n│  Browser (React 19 + Tailwind CSS 4)                         │\n│  ┌─────────────────────────────────────────────────────────┐ │\n│  │  Layout responsivo (menu lateral / hamburguer \u003c 768px)  │ │\n│  │  Módulos: Clientes · Fornecedores · Funcionários        │ │\n│  │           MP · Modelos de Sela · Produção · Estoque PA  │ │\n│  │           Vendas · Comissões · Fin. (ADM) · Dashboard   │ │\n│  └─────────────────────────────────────────────────────────┘ │\n└───────────────────────────┬──────────────────────────────────┘\n                            │ HTTPS / fetch\n┌───────────────────────────▼──────────────────────────────────┐\n│  Next.js 16 App Router (Edge / Node.js runtime)              │\n│  ┌────────────────────────────────────────────────────────┐  │\n│  │  Route Handlers (src/app/api/**)                       │  │\n│  │  Middleware de autenticação (NextAuth + src/middleware) │  │\n│  │  Server Actions opcionais para formulários simples     │  │\n│  └───────────────────────┬────────────────────────────────┘  │\n└───────────────────────────┼──────────────────────────────────┘\n                            │ SQL (pg)\n┌───────────────────────────▼──────────────────────────────────┐\n│  PostgreSQL 16 (Docker / compose.yaml)                       │\n│  Schema: selas_*  (namespace próprio, não polui schema atual)│\n└──────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## Estrutura de Diretórios\n\n```\nsrc/\n  app/\n    api/\n      selas/\n        clientes/route.ts\n        clientes/[id]/route.ts\n        fornecedores/route.ts\n        fornecedores/[id]/route.ts\n        funcionarios/route.ts\n        funcionarios/[id]/route.ts\n        materias-primas/route.ts\n        materias-primas/[id]/route.ts\n        materias-primas/[id]/movimentacoes/route.ts\n        modelos-sela/route.ts\n        modelos-sela/[id]/route.ts\n        ordens-producao/route.ts\n        ordens-producao/[id]/route.ts\n        ordens-producao/[id]/etapas/route.ts\n        ordens-producao/[id]/requisicoes/route.ts\n        estoque-pa/route.ts\n        estoque-pa/[id]/movimentacoes/route.ts\n        pedidos-venda/route.ts\n        pedidos-venda/[id]/route.ts\n        comissoes/route.ts\n        comissoes/[id]/route.ts\n        contas-receber/route.ts\n        contas-receber/[id]/route.ts\n        contas-pagar/route.ts\n        contas-pagar/[id]/route.ts\n        fluxo-caixa/route.ts\n        dashboard/route.ts\n    selas/\n      layout.tsx               ← layout com menu lateral responsivo\n      page.tsx                 ← redireciona para /selas/dashboard\n      dashboard/page.tsx\n      clientes/page.tsx\n      fornecedores/page.tsx\n      funcionarios/page.tsx\n      materias-primas/page.tsx\n      modelos-sela/page.tsx\n      producao/page.tsx\n      estoque/page.tsx\n      vendas/page.tsx\n      comissoes/page.tsx\n      financeiro/page.tsx      ← visível somente para ADMIN\n  lib/\n    selas/\n      db-selas.ts              ← funções de acesso ao banco (schema selas_*)\n      auth-selas.ts            ← helpers de verificação de perfil\n      calculations.ts          ← funções puras: custos, comissões, totais\n  components/\n    selas/\n      SideNav.tsx\n      DataTable.tsx\n      FormModal.tsx\n      StatusBadge.tsx\n      AlertBadge.tsx\n      ConfirmToast.tsx\n```\n\n---\n\n## Data Models\n\n### Tabelas principais (schema `public`, prefixo `selas_`)\n\n#### `selas_clientes`\n```sql\nCREATE TABLE selas_clientes (\n  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  nome        TEXT NOT NULL,\n  cpf_cnpj    TEXT NOT NULL UNIQUE,\n  telefone    TEXT,\n  email       TEXT,\n  endereco    TEXT,\n  ativo       BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_fornecedores`\n```sql\nCREATE TABLE selas_fornecedores (\n  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  nome        TEXT NOT NULL,\n  cpf_cnpj    TEXT NOT NULL UNIQUE,\n  telefone    TEXT,\n  email       TEXT,\n  endereco    TEXT,\n  categoria   TEXT NOT NULL CHECK (categoria IN (\u0027MATERIA_PRIMA\u0027,\u0027SERVICO\u0027,\u0027AMBOS\u0027)),\n  ativo       BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_funcionarios`\n```sql\nCREATE TABLE selas_funcionarios (\n  id                   UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  nome                 TEXT NOT NULL,\n  cpf                  TEXT NOT NULL UNIQUE,\n  telefone             TEXT,\n  funcoes              TEXT[] NOT NULL DEFAULT \u0027{}\u0027,\n  salario_hora         NUMERIC(10,2) NOT NULL DEFAULT 0 CHECK (salario_hora \u003e= 0),\n  percentual_comissao  NUMERIC(5,2)  NOT NULL DEFAULT 0 CHECK (percentual_comissao BETWEEN 0 AND 100),\n  ativo                BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at           TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_materias_primas`\n```sql\nCREATE TABLE selas_materias_primas (\n  id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  nome              TEXT NOT NULL,\n  unidade_medida    TEXT NOT NULL CHECK (unidade_medida IN (\u0027METRO\u0027,\u0027QUILOGRAMA\u0027,\u0027UNIDADE\u0027,\u0027PAR\u0027)),\n  custo_unitario    NUMERIC(12,4) NOT NULL DEFAULT 0 CHECK (custo_unitario \u003e= 0),\n  estoque_minimo    NUMERIC(12,4) NOT NULL DEFAULT 0 CHECK (estoque_minimo \u003e= 0),\n  estoque_atual     NUMERIC(12,4) NOT NULL DEFAULT 0 CHECK (estoque_atual \u003e= 0),\n  ativo             BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_movimentacoes_mp`\n```sql\nCREATE TABLE selas_movimentacoes_mp (\n  id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  materia_prima_id  UUID NOT NULL REFERENCES selas_materias_primas(id),\n  tipo              TEXT NOT NULL CHECK (tipo IN (\u0027ENTRADA\u0027,\u0027SAIDA\u0027,\u0027AJUSTE\u0027)),\n  quantidade        NUMERIC(12,4) NOT NULL,\n  custo_unitario    NUMERIC(12,4),\n  fornecedor_id     UUID REFERENCES selas_fornecedores(id),\n  ordem_producao_id UUID,\n  justificativa     TEXT,\n  data              DATE NOT NULL DEFAULT CURRENT_DATE,\n  created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_modelos_sela`\n```sql\nCREATE TABLE selas_modelos_sela (\n  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  nome        TEXT NOT NULL,\n  descricao   TEXT,\n  categoria   TEXT NOT NULL,\n  ativo       BOOLEAN NOT NULL DEFAULT TRUE,\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_modelos_materiais` (composição padrão)\n```sql\nCREATE TABLE selas_modelos_materiais (\n  id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  modelo_id        UUID NOT NULL REFERENCES selas_modelos_sela(id) ON DELETE CASCADE,\n  materia_prima_id UUID NOT NULL REFERENCES selas_materias_primas(id),\n  quantidade       NUMERIC(12,4) NOT NULL CHECK (quantidade \u003e 0),\n  UNIQUE (modelo_id, materia_prima_id)\n);\n```\n\n#### `selas_ordens_producao`\n```sql\nCREATE TABLE selas_ordens_producao (\n  id                    UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  tipo                  TEXT NOT NULL CHECK (tipo IN (\u0027ENCOMENDA\u0027,\u0027ESTOQUE\u0027)),\n  modelo_id             UUID NOT NULL REFERENCES selas_modelos_sela(id),\n  cliente_id            UUID REFERENCES selas_clientes(id),\n  quantidade            INTEGER NOT NULL CHECK (quantidade \u003e 0),\n  data_abertura         DATE NOT NULL DEFAULT CURRENT_DATE,\n  data_prevista         DATE,\n  status                TEXT NOT NULL DEFAULT \u0027ABERTA\u0027\n                          CHECK (status IN (\u0027ABERTA\u0027,\u0027EM_PRODUCAO\u0027,\u0027CONCLUIDA\u0027,\u0027CANCELADA\u0027)),\n  custo_total_materiais NUMERIC(14,2) NOT NULL DEFAULT 0,\n  custo_total_mao_obra  NUMERIC(14,2) NOT NULL DEFAULT 0,\n  created_at            TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_etapas_producao`\n```sql\nCREATE TABLE selas_etapas_producao (\n  id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  ordem_id          UUID NOT NULL REFERENCES selas_ordens_producao(id) ON DELETE CASCADE,\n  nome_etapa        TEXT NOT NULL,\n  funcionario_id    UUID NOT NULL REFERENCES selas_funcionarios(id),\n  data_execucao     DATE NOT NULL,\n  horas_trabalhadas NUMERIC(6,2) NOT NULL CHECK (horas_trabalhadas \u003e 0),\n  custo_mao_obra    NUMERIC(12,2) NOT NULL,\n  created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_requisicoes_material`\n```sql\nCREATE TABLE selas_requisicoes_material (\n  id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  ordem_id         UUID NOT NULL REFERENCES selas_ordens_producao(id) ON DELETE CASCADE,\n  materia_prima_id UUID NOT NULL REFERENCES selas_materias_primas(id),\n  quantidade       NUMERIC(12,4) NOT NULL CHECK (quantidade \u003e 0),\n  custo_unitario   NUMERIC(12,4) NOT NULL,\n  confirmada       BOOLEAN NOT NULL DEFAULT FALSE,\n  created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_estoque_pa`\n```sql\nCREATE TABLE selas_estoque_pa (\n  id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  modelo_id         UUID NOT NULL UNIQUE REFERENCES selas_modelos_sela(id),\n  quantidade        INTEGER NOT NULL DEFAULT 0 CHECK (quantidade \u003e= 0),\n  custo_medio       NUMERIC(12,4) NOT NULL DEFAULT 0 CHECK (custo_medio \u003e= 0),\n  updated_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_movimentacoes_pa`\n```sql\nCREATE TABLE selas_movimentacoes_pa (\n  id                UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  modelo_id         UUID NOT NULL REFERENCES selas_modelos_sela(id),\n  tipo              TEXT NOT NULL CHECK (tipo IN (\u0027ENTRADA\u0027,\u0027SAIDA\u0027,\u0027AJUSTE\u0027)),\n  quantidade        INTEGER NOT NULL,\n  custo_unitario    NUMERIC(12,4),\n  ordem_id          UUID REFERENCES selas_ordens_producao(id),\n  pedido_id         UUID,\n  justificativa     TEXT,\n  data              DATE NOT NULL DEFAULT CURRENT_DATE,\n  created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_pedidos_venda`\n```sql\nCREATE TABLE selas_pedidos_venda (\n  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  cliente_id      UUID NOT NULL REFERENCES selas_clientes(id),\n  funcionario_id  UUID NOT NULL REFERENCES selas_funcionarios(id),\n  data_pedido     DATE NOT NULL DEFAULT CURRENT_DATE,\n  valor_frete     NUMERIC(12,2) NOT NULL DEFAULT 0,\n  valor_itens     NUMERIC(14,2) NOT NULL DEFAULT 0,\n  valor_total     NUMERIC(14,2) NOT NULL DEFAULT 0,\n  status          TEXT NOT NULL DEFAULT \u0027RASCUNHO\u0027\n                    CHECK (status IN (\u0027RASCUNHO\u0027,\u0027CONFIRMADO\u0027,\u0027FATURADO\u0027,\u0027ENTREGUE\u0027,\u0027CANCELADO\u0027)),\n  observacoes     TEXT,\n  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_itens_pedido`\n```sql\nCREATE TABLE selas_itens_pedido (\n  id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  pedido_id        UUID NOT NULL REFERENCES selas_pedidos_venda(id) ON DELETE CASCADE,\n  modelo_id        UUID NOT NULL REFERENCES selas_modelos_sela(id),\n  quantidade       INTEGER NOT NULL CHECK (quantidade \u003e 0),\n  preco_unitario   NUMERIC(12,2) NOT NULL CHECK (preco_unitario \u003e= 0),\n  subtotal         NUMERIC(14,2) NOT NULL\n);\n```\n\n#### `selas_faturas`\n```sql\nCREATE TABLE selas_faturas (\n  id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  pedido_id   UUID NOT NULL REFERENCES selas_pedidos_venda(id),\n  valor_total NUMERIC(14,2) NOT NULL,\n  status      TEXT NOT NULL DEFAULT \u0027ATIVA\u0027 CHECK (status IN (\u0027ATIVA\u0027,\u0027CANCELADA\u0027)),\n  created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_comissoes`\n```sql\nCREATE TABLE selas_comissoes (\n  id                   UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  pedido_id            UUID NOT NULL REFERENCES selas_pedidos_venda(id),\n  funcionario_id       UUID NOT NULL REFERENCES selas_funcionarios(id),\n  valor_base           NUMERIC(14,2) NOT NULL,\n  percentual_aplicado  NUMERIC(5,2) NOT NULL,\n  valor_comissao       NUMERIC(12,2) NOT NULL,\n  status               TEXT NOT NULL DEFAULT \u0027PENDENTE\u0027\n                         CHECK (status IN (\u0027PENDENTE\u0027,\u0027PAGA\u0027,\u0027CANCELADA\u0027)),\n  created_at           TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_contas_receber`\n```sql\nCREATE TABLE selas_contas_receber (\n  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  fatura_id       UUID NOT NULL REFERENCES selas_faturas(id),\n  cliente_id      UUID NOT NULL REFERENCES selas_clientes(id),\n  parcela         SMALLINT NOT NULL DEFAULT 1,\n  valor           NUMERIC(12,2) NOT NULL CHECK (valor \u003e 0),\n  data_vencimento DATE NOT NULL,\n  status          TEXT NOT NULL DEFAULT \u0027EM_ABERTO\u0027\n                    CHECK (status IN (\u0027EM_ABERTO\u0027,\u0027RECEBIDA\u0027,\u0027VENCIDA\u0027,\u0027CANCELADA\u0027)),\n  data_recebimento DATE,\n  valor_recebido  NUMERIC(12,2),\n  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_contas_pagar`\n```sql\nCREATE TABLE selas_contas_pagar (\n  id               UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  beneficiario_tipo TEXT NOT NULL CHECK (beneficiario_tipo IN (\u0027FORNECEDOR\u0027,\u0027FUNCIONARIO\u0027)),\n  fornecedor_id    UUID REFERENCES selas_fornecedores(id),\n  funcionario_id   UUID REFERENCES selas_funcionarios(id),\n  descricao        TEXT NOT NULL,\n  valor            NUMERIC(12,2) NOT NULL CHECK (valor \u003e 0),\n  data_vencimento  DATE NOT NULL,\n  categoria        TEXT NOT NULL\n                     CHECK (categoria IN (\u0027MATERIA_PRIMA\u0027,\u0027SERVICO\u0027,\u0027COMISSAO\u0027,\u0027FRETE\u0027,\u0027OUTROS\u0027)),\n  status           TEXT NOT NULL DEFAULT \u0027EM_ABERTO\u0027\n                     CHECK (status IN (\u0027EM_ABERTO\u0027,\u0027PAGA\u0027,\u0027VENCIDA\u0027,\u0027CANCELADA\u0027)),\n  data_pagamento   DATE,\n  valor_pago       NUMERIC(12,2),\n  origem_entrada_id UUID REFERENCES selas_movimentacoes_mp(id),\n  created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n#### `selas_fluxo_caixa`\n```sql\nCREATE TABLE selas_fluxo_caixa (\n  id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),\n  tipo            TEXT NOT NULL CHECK (tipo IN (\u0027ENTRADA\u0027,\u0027SAIDA\u0027)),\n  valor           NUMERIC(12,2) NOT NULL CHECK (valor \u003e 0),\n  descricao       TEXT NOT NULL,\n  data            DATE NOT NULL,\n  conta_receber_id UUID REFERENCES selas_contas_receber(id),\n  conta_pagar_id  UUID REFERENCES selas_contas_pagar(id),\n  lancamento_avulso BOOLEAN NOT NULL DEFAULT FALSE,\n  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n```\n\n---\n\n## Components and Interfaces\n\n### Layout Responsivo\n\nO layout principal (`selas/layout.tsx`) utiliza um menu lateral fixo em viewports ≥ 768 px e um menu colapsável com ícone hamburguer em viewports menores, usando a classe `md:flex hidden` do Tailwind e estado React para controle da abertura.\n\n```tsx\n// Estrutura simplificada do layout\n\u003cdiv className=\"flex min-h-screen\"\u003e\n  {/* Menu lateral — oculto em mobile */}\n  \u003caside className=\"hidden md:flex flex-col w-56 bg-gray-900 text-white\"\u003e\n    \u003cSideNav perfil={session.user.perfil} /\u003e\n  \u003c/aside\u003e\n\n  {/* Menu hamburguer — visível em mobile */}\n  \u003cMobileNav perfil={session.user.perfil} /\u003e\n\n  {/* Conteúdo principal */}\n  \u003cmain className=\"flex-1 p-4\"\u003e{children}\u003c/main\u003e\n\u003c/div\u003e\n```\n\n### Itens de Navegação por Perfil\n\n| Item de Menu      | ADMIN | OPERACIONAL |\n|-------------------|:-----:|:-----------:|\n| Dashboard         | ✓     | ✓           |\n| Clientes          | ✓     | ✓           |\n| Fornecedores      | ✓     | ✓           |\n| Funcionários      | ✓     | ✓           |\n| Matérias-Primas   | ✓     | ✓           |\n| Modelos de Sela   | ✓     | ✓           |\n| Produção          | ✓     | ✓           |\n| Estoque           | ✓     | ✓           |\n| Vendas            | ✓     | ✓           |\n| Comissões         | ✓     | ✓           |\n| Financeiro        | ✓     | ✗           |\n\n### Padrões de UI Reutilizáveis\n\n- **`DataTable`** — tabela com paginação, busca e filtros; renderiza lista completa em desktop e cards empilhados em mobile.\n- **`FormModal`** — modal de formulário com validação inline; `dialog` HTML nativo para acessibilidade.\n- **`StatusBadge`** — pastilha colorida para status (Aberta, Em Produção, Concluída, Cancelada, etc.).\n- **`AlertBadge`** — ícone de alerta vermelho exibido quando estoque ≤ mínimo.\n- **`ConfirmToast`** — notificação toast de sucesso / erro, posicionada no canto superior direito com `aria-live=\"polite\"`.\n- Todos os elementos interativos têm `min-w-[44px] min-h-[44px]` via classe Tailwind, garantindo área de toque mínima.\n\n---\n\n## Interfaces das API Routes\n\nTodas as rotas seguem o padrão REST com JSON. Cada handler verifica a sessão NextAuth e o perfil antes de processar.\n\n### Padrão de Resposta\n\n```typescript\n// Sucesso\n{ data: T, message?: string }\n\n// Erro\n{ error: string, details?: string }\n```\n\n### Endpoints Principais\n\n| Método | Rota                                        | Descrição                                        | Perfil mínimo  |\n|--------|---------------------------------------------|--------------------------------------------------|----------------|\n| GET    | `/api/selas/clientes`                       | Lista clientes (busca por nome/CPF)              | OPERACIONAL    |\n| POST   | `/api/selas/clientes`                       | Cria cliente                                     | OPERACIONAL    |\n| PUT    | `/api/selas/clientes/[id]`                  | Edita cliente                                    | OPERACIONAL    |\n| PATCH  | `/api/selas/clientes/[id]`                  | Inativa/ativa cliente                            | ADMIN          |\n| GET    | `/api/selas/fornecedores`                   | Lista fornecedores                               | OPERACIONAL    |\n| POST   | `/api/selas/fornecedores`                   | Cria fornecedor (cria Conta a Pagar se entrada)  | OPERACIONAL    |\n| GET    | `/api/selas/funcionarios`                   | Lista funcionários                               | OPERACIONAL    |\n| POST   | `/api/selas/funcionarios`                   | Cria funcionário                                 | OPERACIONAL    |\n| GET    | `/api/selas/materias-primas`                | Lista MPs com saldo e alerta de estoque          | OPERACIONAL    |\n| POST   | `/api/selas/materias-primas`                | Cria MP                                          | OPERACIONAL    |\n| POST   | `/api/selas/materias-primas/[id]/movimentacoes` | Registra entrada / ajuste de estoque         | OPERACIONAL / ADMIN |\n| GET    | `/api/selas/modelos-sela`                   | Lista modelos com custo estimado                 | OPERACIONAL    |\n| POST   | `/api/selas/modelos-sela`                   | Cria modelo com materiais                        | OPERACIONAL    |\n| PUT    | `/api/selas/modelos-sela/[id]`              | Edita modelo (recalcula custo)                   | OPERACIONAL    |\n| GET    | `/api/selas/ordens-producao`                | Lista OPs com filtros                            | OPERACIONAL    |\n| POST   | `/api/selas/ordens-producao`                | Cria OP                                          | OPERACIONAL    |\n| PUT    | `/api/selas/ordens-producao/[id]`           | Atualiza status da OP                            | OPERACIONAL    |\n| POST   | `/api/selas/ordens-producao/[id]/etapas`    | Adiciona apontamento de produção                 | OPERACIONAL    |\n| POST   | `/api/selas/ordens-producao/[id]/requisicoes` | Confirma requisição de materiais               | OPERACIONAL    |\n| GET    | `/api/selas/estoque-pa`                     | Saldo do estoque PA por modelo                   | OPERACIONAL    |\n| GET    | `/api/selas/pedidos-venda`                  | Lista pedidos com filtros                        | OPERACIONAL    |\n| POST   | `/api/selas/pedidos-venda`                  | Cria pedido (Rascunho)                           | OPERACIONAL    |\n| PUT    | `/api/selas/pedidos-venda/[id]`             | Confirma / cancela pedido                        | OPERACIONAL    |\n| GET    | `/api/selas/comissoes`                      | Lista comissões com totais por funcionário       | OPERACIONAL    |\n| PUT    | `/api/selas/comissoes/[id]`                 | Registra pagamento de comissão                   | OPERACIONAL    |\n| GET    | `/api/selas/contas-receber`                 | Lista contas a receber com filtros               | OPERACIONAL    |\n| PUT    | `/api/selas/contas-receber/[id]`            | Registra recebimento de parcela                  | OPERACIONAL    |\n| GET    | `/api/selas/contas-pagar`                   | Lista contas a pagar com filtros                 | OPERACIONAL    |\n| POST   | `/api/selas/contas-pagar`                   | Cria conta a pagar manualmente                   | OPERACIONAL    |\n| PUT    | `/api/selas/contas-pagar/[id]`              | Registra pagamento                               | OPERACIONAL    |\n| GET    | `/api/selas/fluxo-caixa`                    | Extrato por período                              | ADMIN          |\n| POST   | `/api/selas/fluxo-caixa`                    | Lançamento avulso                                | ADMIN          |\n| GET    | `/api/selas/dashboard`                      | Indicadores do dashboard                         | OPERACIONAL    |\n\n---\n\n## Fluxos de Negócio Críticos\n\n### Fluxo de Produção\n\n```\nCriar OP (tipo + modelo + cliente?)\n  → pré-preencher materiais do modelo\n  → ajustar quantidades se necessário\n  → Confirmar requisição de materiais\n      → decrementar selas_materias_primas.estoque_atual\n      → inserir selas_movimentacoes_mp (SAIDA)\n      → inserir/atualizar selas_contas_pagar (se entrada de MP)\n  → Registrar etapas de produção (apontamentos)\n      → calcular custo_mao_obra = horas × salario_hora do funcionário\n  → Concluir OP (status = CONCLUIDA)\n      → incrementar selas_estoque_pa.quantidade\n      → recalcular custo_medio_pa\n      → inserir selas_movimentacoes_pa (ENTRADA)\n```\n\n### Fluxo de Venda\n\n```\nCriar Pedido (Rascunho)\n  → adicionar itens (modelo + qty + preço)\n  → calcular valor_itens = Σ(qty × preço)\n  → calcular valor_total = valor_itens + frete\n  → Confirmar Pedido\n      → verificar estoque_pa ≥ quantidade vendida\n      → decrementar selas_estoque_pa\n      → inserir selas_movimentacoes_pa (SAIDA)\n      → calcular comissão = valor_itens × percentual_comissao\n      → inserir selas_comissoes\n      → gerar selas_faturas\n      → inserir selas_contas_receber (parcelas)\n```\n\n### Fluxo Financeiro\n\n```\nRecebimento de parcela (contas_receber)\n  → status = RECEBIDA\n  → inserir selas_fluxo_caixa (ENTRADA)\n\nPagamento de conta (contas_pagar)\n  → status = PAGA\n  → inserir selas_fluxo_caixa (SAIDA)\n\nAtualização de Vencidos (job diário ou verificação on-read)\n  → contas_receber: EM_ABERTO + data_vencimento \u003c hoje → VENCIDA\n  → contas_pagar:  EM_ABERTO + data_vencimento \u003c hoje → VENCIDA\n```\n\n### Cancelamento de Pedido\n\n```\nCancelar Pedido (após confirmação)\n  → reverter selas_estoque_pa (+quantidade)\n  → inserir selas_movimentacoes_pa (ENTRADA — reversão)\n  → marcar selas_faturas como CANCELADA\n  → marcar selas_contas_receber como CANCELADA\n  → marcar selas_comissoes como CANCELADA\n```\n\n---\n\n## Funções Puras de Cálculo (`src/lib/selas/calculations.ts`)\n\n```typescript\n/** Custo estimado de materiais de um modelo */\nexport function calcularCustoModeloSela(\n  materiais: { quantidade: number; custo_unitario: number }[]\n): number {\n  return materiais.reduce((acc, m) =\u003e acc + m.quantidade * m.custo_unitario, 0);\n}\n\n/** Custo de mão de obra de uma etapa */\nexport function calcularCustoEtapa(\n  horasTrabalhadas: number,\n  salarioHora: number\n): number {\n  return horasTrabalhadas * salarioHora;\n}\n\n/** Custo total de uma Ordem de Produção */\nexport function calcularCustoOrdem(\n  custoMateriais: number,\n  custoMaoObra: number\n): number {\n  return custoMateriais + custoMaoObra;\n}\n\n/** Valor total de um Pedido de Venda */\nexport function calcularTotalPedido(\n  itens: { quantidade: number; preco_unitario: number }[],\n  frete: number\n): { valorItens: number; valorTotal: number } {\n  const valorItens = itens.reduce((acc, i) =\u003e acc + i.quantidade * i.preco_unitario, 0);\n  return { valorItens, valorTotal: valorItens + frete };\n}\n\n/** Valor de comissão */\nexport function calcularComissao(\n  valorItens: number,\n  percentualComissao: number\n): number {\n  return (valorItens * percentualComissao) / 100;\n}\n\n/** Saldo do fluxo de caixa em um período */\nexport function calcularSaldoCaixa(\n  movimentacoes: { tipo: \u0027ENTRADA\u0027 | \u0027SAIDA\u0027; valor: number }[]\n): number {\n  return movimentacoes.reduce(\n    (acc, m) =\u003e (m.tipo === \u0027ENTRADA\u0027 ? acc + m.valor : acc - m.valor),\n    0\n  );\n}\n\n/** Verifica se uma conta está vencida */\nexport function isVencida(dataVencimento: Date, hoje: Date = new Date()): boolean {\n  return dataVencimento \u003c hoje;\n}\n```\n\n---\n\n## Error Handling\n\n| Situação                                          | Resposta HTTP | Mensagem retornada                                  |\n|---------------------------------------------------|:-------------:|-----------------------------------------------------|\n| Credenciais inválidas                             | 401           | \"E-mail ou senha inválidos\"                         |\n| Acesso sem autenticação                           | 401           | \"Não autenticado\"                                   |\n| Acesso a rota restrita por perfil                 | 403           | \"Acesso negado\"                                     |\n| CPF/CNPJ duplicado (clientes, fornecedores, func.)| 409           | \"CPF/CNPJ já cadastrado\" / \"CPF já cadastrado\"      |\n| Estoque de MP insuficiente                        | 422           | \"Estoque insuficiente para [nome da matéria-prima]\" |\n| Estoque de PA insuficiente                        | 422           | \"Estoque insuficiente para [nome do modelo]\"        |\n| Edição de OP Concluída/Cancelada                  | 422           | \"Ordem de produção não pode ser editada neste status\"|\n| Campos obrigatórios ausentes                      | 400           | \"Campo obrigatório: [campo]\"                        |\n| Recurso não encontrado                            | 404           | \"Registro não encontrado\"                           |\n| Erro interno                                      | 500           | \"Erro interno. Tente novamente.\"                    |\n\nErros de validação são exibidos inline nos formulários e também como `ConfirmToast` de erro.\n\n---\n\n## Segurança\n\n- Senhas são armazenadas com hash `bcryptjs` (já utilizado no projeto).\n- Todas as API Routes verificam a sessão NextAuth via `getServerSession` antes de processar qualquer operação.\n- Operações de inativação e exclusão são restritas ao perfil ADMIN, verificado no handler.\n- Consultas SQL usam parâmetros posicionais (`$1`, `$2`) via `pg` para evitar injeção SQL.\n- O módulo Financeiro (Fluxo de Caixa) só é renderizado e acessível para perfil ADMIN.\n\n---\n\n## Responsividade e Acessibilidade\n\n- Tailwind CSS 4 com breakpoints `md:` para separar layout desktop/mobile.\n- Menu lateral fixo em `md:` e hamburguer colapsável em mobile.\n- `DataTable` renderiza tabela em `md:` e cartões em mobile (`block md:table`).\n- Todos os botões e links têm `min-w-[44px] min-h-[44px]` e `touch-action: manipulation`.\n- Formulários usam `\u003clabel\u003e` associado a cada `\u003cinput\u003e` via `htmlFor`.\n- Alertas de estoque mínimo e mensagens de erro usam `role=\"alert\"` e `aria-live=\"polite\"`.\n- Modais usam `\u003cdialog\u003e` nativo com `autofocus` no primeiro campo e trap de foco.\n\n---\n\n## Testing Strategy\n\nA estratégia de testes combina testes unitários para funções puras e testes de propriedade para invariantes universais do domínio.\n\n### Testes Unitários (baseados em exemplos)\n- Fluxos de autenticação (login válido, logout, redirecionamento sem sessão)\n- Transições de status (OP: Aberta → Em Produção → Concluída; Pedido: Rascunho → Confirmado → Cancelado)\n- Navegação: verificar que todos os módulos do menu estão presentes e acessíveis\n- Cancelamento de Pedido com OP do tipo encomenda (exibição de alerta)\n\n### Testes de Propriedade (property-based)\nUsando geração aleatória de entradas para validar invariantes universais:\n\n- **Cálculos financeiros** (`calculations.ts`): custo estimado de modelos, custo de etapas, total de pedidos, valor de comissão, saldo de caixa — verificar com entradas numéricas arbitrárias\n- **Unicidade de documentos**: para qualquer CPF/CNPJ gerado, tentativa duplicada deve ser rejeitada\n- **Consistência de estoque**: para qualquer sequência de entradas e saídas, saldo = Σentradas − Σsaídas\n- **Comissão sem frete**: para qualquer pedido com itens e frete variados, comissão = valor_itens × taxa (nunca inclui frete)\n- **Parcelas de fatura**: para qualquer número N de parcelas e valor total V, Σparcelas = V\n- **Reversibilidade de cancelamento**: para qualquer pedido confirmado→cancelado, estoque PA retorna ao valor pré-venda\n\n### Cobertura de Casos de Borda\nOs geradores de propriedade devem incluir:\n- Estoque zerado (edge: requisição de qualquer quantidade \u003e 0 deve ser rejeitada)\n- Whitespace em campos de texto obrigatórios (edge: deve ser tratado como vazio)\n- Frete zero (edge: comissão não deve mudar; total = valor_itens)\n- Datas de vencimento no passado (edge: status VENCIDA exibido imediatamente)\n\n### Framework de Testes\nO projeto usa Node.js; recomenda-se **Vitest** com **fast-check** para testes de propriedade, já que ambos são compatíveis com TypeScript e integram-se ao ecossistema Next.js sem configuração adicional. Para execução única (CI): `vitest --run`.\n\n---\n\n## Correctness Properties\n\n*Uma propriedade é uma característica ou comportamento que deve ser verdadeiro em todas as execuções válidas do sistema — essencialmente, uma afirmação formal sobre o que o sistema deve fazer. Propriedades servem como ponte entre especificações legíveis por humanos e garantias de correção verificáveis por máquina.*\n\n### Property 1: Rejeição universal de credenciais inválidas\n\n*Para qualquer* par (e-mail, senha) que não corresponda a um usuário cadastrado no sistema, a tentativa de login deve ser rejeitada com a mensagem \"E-mail ou senha inválidos\" e nenhuma sessão deve ser criada.\n\n**Validates: Requirements 1.2**\n\n---\n\n### Property 2: Redirecionamento de rotas protegidas\n\n*Para qualquer* rota protegida do sistema acessada sem sessão autenticada, o sistema deve redirecionar para a tela de login.\n\n**Validates: Requirements 1.4**\n\n---\n\n### Property 3: Ocultação de funcionalidades restritas ao perfil OPERACIONAL\n\n*Para qualquer* funcionalidade marcada como exclusiva de Administrador (inativação de registros, configurações, módulo Financeiro), um usuário com perfil OPERACIONAL não deve conseguir acessar nem via UI nem via chamada direta à API.\n\n**Validates: Requirements 1.6, 2.5, 3.4, 4.4, 5.4, 7.6, 9.5, 14.1, 14.6**\n\n---\n\n### Property 4: Unicidade de CPF/CNPJ em Clientes, Fornecedores e Funcionários\n\n*Para qualquer* CPF/CNPJ ou CPF já existente no cadastro respectivo, uma nova tentativa de cadastro com o mesmo documento deve ser rejeitada com a mensagem correspondente (\"CPF/CNPJ já cadastrado\" ou \"CPF já cadastrado\") e nenhum registro duplicado deve ser criado.\n\n**Validates: Requirements 2.2, 3.2, 4.2**\n\n---\n\n### Property 5: Consistência dos resultados de busca\n\n*Para qualquer* termo de busca aplicado à listagem de Clientes, Fornecedores, Funcionários, Matérias-Primas ou Modelos de Sela, todos os registros retornados devem conter o termo buscado no campo indexado (nome, CPF/CNPJ, categoria ou função), e nenhum registro que não contenha o termo deve ser retornado.\n\n**Validates: Requirements 2.3, 3.3, 4.3, 5.2, 6.3**\n\n---\n\n### Property 6: Alerta de estoque mínimo de Matérias-Primas\n\n*Para qualquer* Matéria-Prima em que `estoque_atual \u003c= estoque_minimo`, o alerta visual deve ser exibido na listagem e no dashboard. *Para qualquer* Matéria-Prima em que `estoque_atual \u003e estoque_minimo`, o alerta não deve ser exibido.\n\n**Validates: Requirements 5.3**\n\n---\n\n### Property 7: Correção do custo estimado de Modelos de Sela\n\n*Para qualquer* Modelo de Sela com lista de materiais, o custo estimado exibido deve ser igual à soma `Σ(quantidade_i × custo_unitario_i)` sobre todos os materiais vinculados, e deve ser recalculado automaticamente após qualquer edição da lista de materiais.\n\n**Validates: Requirements 6.2, 6.4**\n\n---\n\n### Property 8: Invariante de estoque de Matérias-Primas\n\n*Para qualquer* sequência de operações de entrada, saída (requisição confirmada) e ajuste sobre uma Matéria-Prima, o saldo exibido deve ser sempre igual à soma algébrica de todas as movimentações registradas no histórico, e cada operação deve aparecer no histórico com data, tipo, quantidade e documento de origem corretos.\n\n**Validates: Requirements 7.1, 7.2, 7.4, 7.5**\n\n---\n\n### Property 9: Rejeição de requisição com estoque insuficiente\n\n*Para qualquer* Requisição de Material cuja quantidade solicitada supere o `estoque_atual` da Matéria-Prima, o sistema deve exibir \"Estoque insuficiente para [nome da matéria-prima]\" e impedir a confirmação sem alterar o saldo.\n\n**Validates: Requirements 7.3**\n\n---\n\n### Property 10: Pré-preenchimento de materiais na Ordem de Produção\n\n*Para qualquer* Modelo de Sela existente, ao criar uma Ordem de Produção a partir desse modelo, a lista de materiais pré-preenchida deve conter exatamente os mesmos materiais e quantidades definidos na composição padrão do modelo (antes de ajustes manuais).\n\n**Validates: Requirements 8.2**\n\n---\n\n### Property 11: Correção do custo de mão de obra por etapa\n\n*Para qualquer* Apontamento de Produção com `horas_trabalhadas` e Funcionário com `salario_hora`, o custo calculado deve ser exatamente `horas_trabalhadas × salario_hora`.\n\n**Validates: Requirements 8.3**\n\n---\n\n### Property 12: Correção do custo total da Ordem de Produção\n\n*Para qualquer* Ordem de Produção, o custo total exibido deve ser igual à soma dos custos dos materiais consumidos (quantidade × custo_unitário) mais a soma de todos os apontamentos de mão de obra.\n\n**Validates: Requirements 8.4**\n\n---\n\n### Property 13: Atualização do estoque de PA na conclusão da OP\n\n*Para qualquer* Ordem de Produção marcada como Concluída com quantidade Q de um Modelo M, o `selas_estoque_pa.quantidade` para o Modelo M deve aumentar em exatamente Q, e uma movimentação de ENTRADA deve ser registrada no histórico do Estoque de PA.\n\n**Validates: Requirements 8.6, 9.1, 9.4**\n\n---\n\n### Property 14: Imutabilidade de OPs em status terminal\n\n*Para qualquer* Ordem de Produção com status Concluída ou Cancelada, qualquer tentativa de adicionar, editar ou remover Apontamentos de Produção ou Requisições de Material deve ser rejeitada com erro.\n\n**Validates: Requirements 8.9**\n\n---\n\n### Property 15: Rejeição de Pedido de Venda com estoque de PA insuficiente\n\n*Para qualquer* Pedido de Venda cujo item solicite uma quantidade superior ao `selas_estoque_pa.quantidade` disponível para aquele Modelo, o sistema deve exibir \"Estoque insuficiente para [nome do modelo]\" e impedir a confirmação sem alterar o estoque.\n\n**Validates: Requirements 9.3, 10.5**\n\n---\n\n### Property 16: Correção do valor total do Pedido de Venda\n\n*Para qualquer* Pedido de Venda com itens e frete, o `valor_total` deve ser exatamente `Σ(quantidade_i × preco_unitario_i) + frete`, e o `valor_itens` deve ser exatamente `Σ(quantidade_i × preco_unitario_i)`.\n\n**Validates: Requirements 10.2**\n\n---\n\n### Property 17: Correção do cálculo de Comissão\n\n*Para qualquer* Pedido de Venda confirmado com Funcionário responsável, o valor da comissão gerada deve ser exatamente `valor_itens × (percentual_comissao / 100)`, sem incluir o frete.\n\n**Validates: Requirements 10.3**\n\n---\n\n### Property 18: Consistência das parcelas da Fatura com o total do Pedido\n\n*Para qualquer* Pedido de Venda confirmado com N parcelas definidas, a soma dos valores de todas as parcelas em `selas_contas_receber` deve ser igual ao `valor_total` do pedido.\n\n**Validates: Requirements 10.4, 12.1**\n\n---\n\n### Property 19: Reversibilidade do cancelamento de Pedido\n\n*Para qualquer* Pedido de Venda que estava Confirmado e é cancelado, o `selas_estoque_pa.quantidade` deve retornar ao valor anterior à confirmação, a Fatura deve ter status CANCELADA e as parcelas em `selas_contas_receber` devem ter status CANCELADA.\n\n**Validates: Requirements 10.7**\n\n---\n\n### Property 20: Pagamento de comissão gera Conta a Pagar\n\n*Para qualquer* Comissão cujo pagamento é registrado, o status da comissão deve ser atualizado para PAGA e um registro correspondente deve ser criado em `selas_contas_pagar` com o mesmo valor.\n\n**Validates: Requirements 11.3**\n\n---\n\n### Property 21: Recebimento de parcela atualiza Fluxo de Caixa\n\n*Para qualquer* parcela de `selas_contas_receber` cujo recebimento é registrado, o status deve ser atualizado para RECEBIDA e um lançamento de ENTRADA deve ser inserido em `selas_fluxo_caixa` com o valor recebido.\n\n**Validates: Requirements 12.3**\n\n---\n\n### Property 22: Atualização automática para status VENCIDA\n\n*Para qualquer* conta a receber ou conta a pagar com status EM_ABERTO e `data_vencimento \u003c data_atual`, o sistema deve exibir o status VENCIDA na listagem.\n\n**Validates: Requirements 12.4, 13.5**\n\n---\n\n### Property 23: Entrada de MP gera Conta a Pagar automaticamente\n\n*Para qualquer* entrada de Matéria-Prima vinculada a um Fornecedor, um registro deve ser criado automaticamente em `selas_contas_pagar` com o valor total da entrada e a data de vencimento informada.\n\n**Validates: Requirements 13.2**\n\n---\n\n### Property 24: Pagamento de Conta a Pagar registra saída no Fluxo de Caixa\n\n*Para qualquer* Conta a Pagar cujo pagamento é registrado, o status deve ser atualizado para PAGA e um lançamento de SAIDA deve ser inserido em `selas_fluxo_caixa` com o valor pago.\n\n**Validates: Requirements 13.4**\n\n---\n\n### Property 25: Correção do saldo do Fluxo de Caixa\n\n*Para qualquer* estado do sistema ou período selecionado, o saldo exibido no Fluxo de Caixa deve ser exatamente `Σ(entradas) − Σ(saídas)` dos lançamentos registrados, e o saldo acumulado a cada linha do extrato deve refletir a soma cumulativa até aquele ponto.\n\n**Validates: Requirements 14.2, 14.3, 14.4, 14.5**\n\n---\n\n### Property 26: Indicadores do Dashboard condicionados ao perfil\n\n*Para qualquer* usuário ADMIN, o dashboard deve exibir todos os 5 indicadores, incluindo o saldo do Fluxo de Caixa. *Para qualquer* usuário OPERACIONAL, o dashboard deve exibir 4 indicadores, sem o saldo do Fluxo de Caixa.\n\n**Validates: Requirements 15.1**\n\n---\n\n### Property 27: Responsividade do menu de navegação\n\n*Para qualquer* viewport com largura inferior a 768 px, o menu de navegação deve ser exibido em formato colapsável com ícone hamburguer, e os formulários e tabelas devem estar em layout adaptado para tela pequena (sem scroll horizontal).\n\n**Validates: Requirements 15.3**\n\n---\n\n### Property 28: Área mínima de toque\n\n*Para qualquer* elemento interativo da interface (botão, link, campo de formulário, ícone clicável), a área de toque computada deve ser de pelo menos 44 × 44 pixels.\n\n**Validates: Requirements 15.4**\n\n---\n\n### Property 29: Feedback de operações CRUD\n\n*Para qualquer* operação de criação, edição ou exclusão de registro — bem-sucedida ou com erro —, o sistema deve exibir uma mensagem de feedback correspondente ao resultado da operação.\n\n**Validates: Requirements 15.5**\n",tasks:"# Implementation Plan: Gestão Fábrica de Selas — Especificação\n\n## Overview\n\nEste plano organiza as tarefas de revisão, validação e refinamento dos artefatos de especificação do sistema de gestão da fábrica de selas. O objetivo é garantir que requirements.md e design.md estejam completos, consistentes e prontos para uma futura fase de implementação.\n\n## Tasks\n\n- [ ] 1. Revisar e validar os requisitos de Cadastros Base\n  - [ ] 1.1 Verificar cobertura dos requisitos de Autenticação e Controle de Acesso (Req. 1)\n    - Confirmar que os critérios de aceite cobrem login, logout, redirecionamento e controle por perfil\n    - Verificar se o requisito menciona explicitamente o comportamento de expiração de sessão\n    - _Requirements: 1.1, 1.2, 1.3, 1.4, 1.5, 1.6_\n\n  - [ ] 1.2 Verificar cobertura dos requisitos de Clientes, Fornecedores e Funcionários (Req. 2, 3, 4)\n    - Confirmar que campos obrigatórios e opcionais estão claramente distinguidos\n    - Verificar se o comportamento de reativação de registros inativos está coberto\n    - Confirmar que a busca por múltiplos critérios está descrita\n    - _Requirements: 2.1–2.5, 3.1–3.4, 4.1–4.4_\n\n  - [ ] 1.3 Verificar cobertura dos requisitos de Matérias-Primas e Modelos de Sela (Req. 5, 6)\n    - Confirmar que os tipos de unidade de medida aceitos estão listados\n    - Verificar se o comportamento do custo estimado quando uma MP é inativada está especificado\n    - Confirmar que a composição padrão do modelo pode ter zero itens (modelo vazio)\n    - _Requirements: 5.1–5.4, 6.1–6.4_\n\n- [ ] 2. Revisar e validar os requisitos de Produção e Estoque\n  - [ ] 2.1 Verificar cobertura dos requisitos de Gestão de Estoque de MP (Req. 7)\n    - Confirmar que o histórico de movimentações inclui o documento de origem em todos os tipos\n    - Verificar se o ajuste de inventário exige aprovação ou apenas justificativa\n    - Confirmar o comportamento quando a saída zera exatamente o estoque (caso limite)\n    - _Requirements: 7.1–7.6_\n\n  - [ ] 2.2 Verificar cobertura dos requisitos de Ordens de Produção (Req. 8)\n    - Confirmar que todas as transições de status permitidas estão descritas (ex.: Aberta → Cancelada é permitido?)\n    - Verificar se existe requisito para editar a data prevista de uma OP em andamento\n    - Confirmar o comportamento de cancelamento de OP quando há requisições de material já confirmadas (reversão de estoque)\n    - _Requirements: 8.1–8.9_\n\n  - [ ] 2.3 Verificar cobertura dos requisitos de Estoque de Produtos Acabados (Req. 9)\n    - Confirmar que o custo médio unitário no Estoque de PA é calculado pelo método de custo médio ponderado\n    - Verificar se o ajuste de inventário de PA gera movimentação no histórico\n    - _Requirements: 9.1–9.5_\n\n- [ ] 3. Revisar e validar os requisitos de Vendas e Financeiro\n  - [ ] 3.1 Verificar cobertura dos requisitos de Pedidos de Venda (Req. 10)\n    - Confirmar que o parcelamento da fatura tem regras definidas (mínimo de parcelas, datas)\n    - Verificar se pedidos com itens mistos (estoque + encomenda) são contemplados\n    - Confirmar o comportamento do status \"Faturado\" vs \"Entregue\" (qual ação dispara cada um)\n    - _Requirements: 10.1–10.8_\n\n  - [ ] 3.2 Verificar cobertura dos requisitos de Comissões (Req. 11)\n    - Confirmar que comissão cancelada (via cancelamento de pedido) está descrita em Req. 11\n    - Verificar se existe requisito para estorno de comissão já paga quando pedido é cancelado\n    - _Requirements: 11.1–11.4_\n\n  - [ ] 3.3 Verificar cobertura dos requisitos de Contas a Receber e a Pagar (Req. 12, 13)\n    - Confirmar que a atualização automática para status VENCIDA está descrita como comportamento de leitura (on-read) ou job periódico\n    - Verificar se existe requisito para cancelamento de parcela individual (vs cancelamento total da fatura)\n    - _Requirements: 12.1–12.5, 13.1–13.6_\n\n  - [ ] 3.4 Verificar cobertura dos requisitos de Fluxo de Caixa e Dashboard (Req. 14, 15)\n    - Confirmar que o escopo dos lançamentos avulsos está restrito ao Administrador nos requisitos\n    - Verificar se os indicadores do dashboard são suficientes para o perfil Operacional\n    - Confirmar que o requisito de responsividade (Req. 15.3, 15.4) está alinhado com o design\n    - _Requirements: 14.1–14.6, 15.1–15.5_\n\n- [ ] 4. Checkpoint — Requisitos revisados\n  - Confirmar que todos os itens de verificação das tarefas 1–3 foram resolvidos ou documentados como decisões de projeto.\n\n- [ ] 5. Revisar o design de banco de dados e fluxos de negócio\n  - [ ] 5.1 Verificar consistência do schema SQL com os requisitos\n    - Confirmar que todos os campos obrigatórios dos requisitos têm colunas NOT NULL correspondentes no schema\n    - Verificar que as constraints CHECK do schema cobrem todos os valores de enumeração listados nos requisitos\n    - Confirmar que a FK `selas_movimentacoes_mp.ordem_producao_id` está sem REFERENCES (intencional?) e documentar a decisão\n    - _Requirements: 7.5, 8.3_\n\n  - [ ] 5.2 Verificar cobertura dos fluxos de negócio críticos no design\n    - Confirmar que o fluxo de cancelamento de OP com requisições confirmadas está descrito (reversão de MP)\n    - Verificar se o recálculo do custo médio do Estoque de PA está detalhado no design\n    - Confirmar que o fluxo de geração automática de Conta a Pagar na entrada de MP está no design\n    - _Requirements: 7.1, 8.6, 13.2_\n\n  - [ ] 5.3 Verificar as funções puras de cálculo (`calculations.ts`)\n    - Confirmar que todas as fórmulas de negócio dos requisitos têm uma função pura correspondente no design\n    - Verificar se falta função para custo médio ponderado do Estoque de PA\n    - Confirmar que a função `isVencida` cobre o caso de `data_vencimento === hoje` (vence hoje = vencida?)\n    - _Requirements: 8.4, 10.2, 10.3, 14.3_\n\n- [ ] 6. Revisar a arquitetura de componentes e API\n  - [ ] 6.1 Verificar completude da tabela de endpoints da API\n    - Confirmar que todos os módulos têm endpoints GET, POST e PUT/PATCH listados na tabela\n    - Verificar se faltam endpoints de DELETE ou se a inativação substitui exclusão em todos os casos\n    - Confirmar que o endpoint de ajuste de inventário de PA (`/api/selas/estoque-pa/[id]/movimentacoes`) está listado\n    - _Requirements: 9.5_\n\n  - [ ] 6.2 Verificar consistência do controle de acesso nos endpoints\n    - Confirmar que todos os endpoints de inativação têm perfil mínimo ADMIN na tabela\n    - Verificar se o endpoint do fluxo de caixa (GET e POST) está restrito a ADMIN\n    - _Requirements: 1.5, 1.6, 14.1_\n\n  - [ ] 6.3 Verificar os componentes de UI reutilizáveis\n    - Confirmar que `DataTable` tem comportamento de cards em mobile descrito no design\n    - Verificar se `FormModal` cobre o caso de formulários com campos condicionais (ex.: cliente obrigatório apenas em OP tipo encomenda)\n    - _Requirements: 15.3, 15.4_\n\n- [ ] 7. Revisar as propriedades de correção (Correctness Properties)\n  - [ ] 7.1 Verificar cobertura das propriedades em relação aos requisitos\n    - Mapear cada requisito funcional para ao menos uma propriedade de correção\n    - Identificar requisitos que não têm propriedade associada (ex.: Req. 8.5 — suporte a status)\n    - Confirmar que Property 25 cobre o saldo acumulado linha a linha do extrato\n    - _Requirements: todos os requisitos_\n\n  - [ ] 7.2 Verificar clareza e testabilidade das propriedades\n    - Confirmar que cada propriedade tem precondição, invariante e pós-condição implícitas identificáveis\n    - Verificar se as propriedades de estoque (8, 9, 13) cobrem sequências com ajustes intercalados\n    - Confirmar que Property 19 (reversibilidade de cancelamento) descreve o estado do Estoque de PA antes e depois\n    - _Requirements: 7.2, 7.3, 9.2, 10.7_\n\n- [ ] 8. Checkpoint final — Especificação completa\n  - Confirmar que requirements.md, design.md e tasks.md estão consistentes entre si.\n  - Registrar quaisquer decisões de projeto abertas que precisem de resposta antes da implementação.\n  - Confirmar que o glossário cobre todos os termos técnicos utilizados nos três documentos.\n\n## Notes\n\n- Todas as tarefas são de revisão/validação documental — nenhuma envolve escrita de código\n- Itens marcados com `*` seriam opcionais numa fase de implementação, mas aqui todos são relevantes para a qualidade da spec\n- Decisões de projeto em aberto encontradas durante a revisão devem ser registradas como comentários nos documentos de spec ou em um arquivo de decisões separado\n- A ordem das tarefas segue a dependência natural: requisitos → design de dados → design de API → propriedades formais\n\n## Task Dependency Graph\n\n```json\n{\n  \"waves\": [\n    { \"id\": 0, \"tasks\": [\"1.1\", \"1.2\", \"1.3\"] },\n    { \"id\": 1, \"tasks\": [\"2.1\", \"2.2\", \"2.3\"] },\n    { \"id\": 2, \"tasks\": [\"3.1\", \"3.2\", \"3.3\", \"3.4\"] },\n    { \"id\": 3, \"tasks\": [\"5.1\", \"5.2\", \"5.3\"] },\n    { \"id\": 4, \"tasks\": [\"6.1\", \"6.2\", \"6.3\"] },\n    { \"id\": 5, \"tasks\": [\"7.1\", \"7.2\"] }\n  ]\n}\n```\n"};Object.keys(docs).forEach(function(k){document.getElementById("pane-"+k).innerHTML=marked.parse(docs[k]);});document.querySelectorAll("nav button").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active");});document.querySelectorAll(".pane").forEach(function(p){p.classList.remove("active");});btn.classList.add("active");document.getElementById("pane-"+btn.dataset.pane).classList.add("active");window.scrollTo({top:0,behavior:"smooth"});});});</script></body></html>
